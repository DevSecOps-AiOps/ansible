- name: install packages
  hosts: frontend
  become: yes
  tasks:
  - name: install packages
    package:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop:
    - { name: "nginx", state: "present" }
    - { name: "httpd", state: "absent" }
    - { name: "firewalld", state: "present" }
  