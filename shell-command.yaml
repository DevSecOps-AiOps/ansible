- name: demo on shell vs command
  hosts: local
  connection: local
  tasks:
    - name: command test 
      # command: cat /etc/passwd  | grep root
      shell: cat /etc/passwd  | grep root
      register: users_output
    - name: print output 
      debug:
        msg: "{{ users_output }}"

#here rc =0 success if it is 1 or 2 any number it fails

    - name: list files 
      #command: ls -ltr > /tmp/files.txt
      shell: ls -ltr > /tmp/files.txt
